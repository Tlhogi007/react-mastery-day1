name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Security check
        run: npm run security

      - name: npm audit (high+)
        run: npm run security:audit
        continue-on-error: true
