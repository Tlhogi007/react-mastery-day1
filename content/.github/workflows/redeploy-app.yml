name: Redeploy React Mastery app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Missing secret VERCEL_DEPLOY_HOOK."
            echo "Create a Deploy Hook in Vercel → Project → Settings → Git → Deploy Hooks"
            echo "Then add it as a repository secret named VERCEL_DEPLOY_HOOK."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo
          echo "Vercel redeploy triggered."
