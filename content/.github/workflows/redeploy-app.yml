name: Redeploy React Mastery app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Redeploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing secret VERCEL_TOKEN."
            exit 1
          fi
          vercel redeploy https://react-mastery-day1.vercel.app --token="$VERCEL_TOKEN"
