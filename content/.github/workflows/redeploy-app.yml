name: Redeploy React Mastery app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing secret VERCEL_DEPLOY_HOOK_URL."
            echo "Create a Deploy Hook in Vercel → Project → Settings → Git → Deploy Hooks,"
            echo "then: gh secret set VERCEL_DEPLOY_HOOK_URL -R Tlhogi007/react-mastery-content"
            exit 1
          fi
          # Only allow Vercel deploy-hook hosts (no open redirect / SSRF via secret misuse)
          case "$DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "DEPLOY_HOOK_URL must be a Vercel Deploy Hook URL."
              exit 1
              ;;
          esac
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Deploy hook triggered."
